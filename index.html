<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>udlab</title>
<meta name="description" content="udlab: independent projects by Denis Usanov.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ccircle cx='22' cy='22' r='5' fill='%23e0301e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..800&display=swap">
<style>
:root {
  --ground: #ffffff;
  --ink: #0a0a0a;
  --comment: #5c5c5c;
  --link: #e0301e;
  --tint: rgb(10 10 10 / 0.04);
  --gutter: clamp(1rem, 0.25rem + 3.5vw, 4rem);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0a0a0a;
    --ink: #f2f2f2;
    --comment: #9a9a9a;
    --link: #ff5040;
    --tint: rgb(255 255 255 / 0.06);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--ground);
  color: var(--ink);
  font-family: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-variation-settings: "wdth" 100;
  font-weight: 400;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  scrollbar-color: var(--comment) var(--ground);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--ground);
  display: flex;
  flex-direction: column;
}

::selection { background: var(--link); color: #ffffff; }

a {
  color: var(--link);
  text-decoration-thickness: 1px;
  text-underline-offset: 0.25em;
}

a:hover { text-decoration-thickness: 2px; }

a:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 4px;
}

.zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 82rem;
  padding: clamp(2rem, 1rem + 5vw, 6rem) var(--gutter) clamp(1.5rem, 1rem + 2vw, 3rem);
}

.comment { color: var(--comment); }

.origin h1 {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 1.25rem;
}

.apex {
  font-size: clamp(2.5rem, 0.9rem + 6.2vw, 6rem);
  line-height: 1;
  font-weight: 800;
  font-variation-settings: "wdth" 112.5;
  letter-spacing: -0.04em;
}

.apex .dot { color: var(--link); }

.origin p {
  margin: 0;
  font-size: clamp(0.9375rem, 0.875rem + 0.25vw, 1.125rem);
}

.origin h1 + p { margin-top: clamp(1.25rem, 1rem + 1vw, 2rem); }

.records {
  list-style: none;
  margin: clamp(4rem, 2rem + 8vw, 9rem) 0 0;
  padding: 0;
  display: grid;
  width: fit-content;
  max-width: 100%;
  grid-template-columns: max-content max-content minmax(0, 1fr);
  column-gap: clamp(1.5rem, 1rem + 2.5vw, 3.5rem);
}

.record {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: subgrid;
}

.record a {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: subgrid;
  align-items: baseline;
  padding: 0.75rem 0;
  color: var(--ink);
  text-decoration: none;
  position: relative;
  isolation: isolate;
}

.record a::before {
  content: "";
  position: absolute;
  inset: 0 calc(var(--gutter) * -0.5);
  z-index: -1;
  background: var(--tint);
  opacity: 0;
  transition: opacity 160ms cubic-bezier(0.16, 1, 0.3, 1);
}

.record a:hover::before,
.record a:focus-visible::before { opacity: 1; }

.record a:focus-visible {
  outline: 2px solid var(--link);
  outline-offset: 0;
}

.name {
  font-size: clamp(1.75rem, 1.25rem + 2vw, 3rem);
  line-height: 1.1;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.host {
  font-size: clamp(1rem, 0.9rem + 0.4vw, 1.25rem);
  font-weight: 500;
  color: var(--link);
}

.host-text {
  display: inline-block;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.3em;
  animation: resolve 520ms steps(17, end) 240ms backwards;
}

.record a:hover .host-text,
.record a:focus-visible .host-text { text-decoration-thickness: 3px; }

@keyframes resolve {
  from { clip-path: inset(0 100% 0 0); }
  to { clip-path: inset(0 0 0 0); }
}

.record .comment {
  font-size: clamp(0.9375rem, 0.875rem + 0.25vw, 1.125rem);
}

.foot {
  margin-top: auto;
  padding-top: clamp(4rem, 3rem + 5vw, 8rem);
}

.foot p {
  margin: 0;
  font-size: 0.875rem;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 44rem) {
  .apex {
    font-size: clamp(2.25rem, 0.5rem + 8vw, 3.5rem);
    font-variation-settings: "wdth" 100;
  }
  .records { display: block; width: auto; }
  .record a {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 1rem 0;
  }
  .record a::before { inset: 0 calc(var(--gutter) * -1); }
}

@media (prefers-reduced-motion: reduce) {
  .host-text { animation: none; }
  .record a::before { transition: none; }
}
</style>
</head>
<body>
<main class="zone">
  <header class="origin">
    <h1><span class="apex">udlab<span class="dot">.</span>space<span class="dot">.</span></span></h1>
    <p class="comment">Denis Usanov&rsquo;s lab</p>
    <p class="comment"><a href="https://usanov.info">usanov.info</a></p>
  </header>

  <h2 class="visually-hidden">Projects</h2>
  <ol class="records">
    <li class="record">
      <a href="https://lede.udlab.space">
        <span class="name">lede</span>
        <span class="host"><span class="host-text">lede.udlab.space.</span></span>
        <span class="comment">daily news digest, invite only</span>
      </a>
    </li>
  </ol>

  <footer class="foot">
    <p class="comment">&copy; 2026 Denis Usanov</p>
  </footer>
</main>
</body>
</html>
